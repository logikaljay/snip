name: Build

on:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Ubuntu doesn't package gtk4-layer-shell yet; Debian trixie does, and its
    # older glibc keeps the binary runnable on Arch and other newer distros.
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libgtk4-layer-shell-dev

      - name: Build
        run: make

      - name: Rename binary
        run: |
          mkdir dist
          cp snip "dist/snip-linux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: snip-linux-${{ matrix.arch }}
          path: dist/snip-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum snip-linux-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.${{ github.run_number }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "snip $TAG" \
            --notes "Automated build of ${{ github.sha }}." \
            --latest
